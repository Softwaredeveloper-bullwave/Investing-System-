<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" fill="none">
  <defs>
    <linearGradient id="hornR" x1="330" y1="55" x2="205" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E879F9"/>
      <stop offset="0.45" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="hornL" x1="70" y1="55" x2="195" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E879F9"/>
      <stop offset="0.45" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="fang" x1="200" y1="290" x2="200" y2="425" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="textFill" x1="70" y1="235" x2="330" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C084FC"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.72   0 0 0 0 0.30   0 0 0 0 0.95  0 0 0 0.9 0" result="glowColor"/>
      <feMerge>
        <feMergeNode in="glowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Right horn: main blade + small inner flourish -->
  <g filter="url(#glow)">
    <path d="M205,213 L233,178 L332,58 L318,100 L272,148 L238,196 Z" fill="url(#hornR)" stroke="#F5D0FE" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M228,188 L272,168 L296,205 L245,215 Z" fill="url(#hornR)" opacity="0.92"/>

    <!-- Left horn (mirrored) -->
    <path d="M195,213 L167,178 L68,58 L82,100 L128,148 L162,196 Z" fill="url(#hornL)" stroke="#F5D0FE" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M172,188 L128,168 L104,205 L155,215 Z" fill="url(#hornL)" opacity="0.92"/>
  </g>

  <!-- CBW wordmark -->
  <g filter="url(#glow)">
    <text x="200" y="278" text-anchor="middle"
      font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-style="italic"
      font-size="76" letter-spacing="2" fill="url(#textFill)" transform="skewX(-6)">CBW</text>
  </g>

  <!-- Bottom fang / chevron -->
  <g filter="url(#glow)">
    <path d="M140,300 L200,300 L200,345 L246,300 L262,300 L204,423 L196,423 L138,300 Z" fill="url(#fang)"/>
    <path d="M160,308 L178,308 L150,340 L136,340 Z" fill="url(#fang)" opacity="0.85"/>
  </g>
</svg>
